<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="icon.png"><link rel="stylesheet" href="style.css"><title>Connect TikTok · Spoon Atlas</title><meta name="robots" content="noindex"></head><body><main><header><img src="icon.png" alt=""><div><strong>Spoon Atlas</strong><nav><a href="./">Home</a><a href="privacy.html">Privacy</a><a href="terms.html">Terms</a></nav></div></header>
<h1>TikTok connected</h1>
<div id="ok" class="card" hidden><p>Copy this one-time code and follow Claude's instructions in the project thread. It works once and expires within minutes.</p>
<p><code id="code"></code></p><button id="copy">Copy code</button> <span id="done" class="muted"></span></div>
<div id="err" class="card" hidden><p>TikTok did not send a code: <code id="why"></code>. Close this page and try the link again.</p></div>
<script>
const p=new URLSearchParams(location.search),c=p.get('code');
if(c){document.getElementById('ok').hidden=false;document.getElementById('code').textContent=c;
document.getElementById('copy').onclick=()=>navigator.clipboard.writeText(c).then(()=>document.getElementById('done').textContent='Copied');}
else{document.getElementById('err').hidden=false;document.getElementById('why').textContent=p.get('error_description')||p.get('error')||'no code';}
</script>
<footer>Spoon Atlas · contact: <a href="mailto:spoonatlas@gmail.com">spoonatlas@gmail.com</a></footer></main></body></html>
